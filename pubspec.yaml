name: attendly
description: "Attendance Tracker with Role-Based Access (Admin/User)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1

  # State Management
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^17.1.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.7.1

  # Firebase Integration
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # Local Offline Storage (Drift SQLite & SharedPreferences)
  drift: ^2.25.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5

  # Location Services
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Media & Utilities
  http: ^1.2.2
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.3
  intl: ^0.20.2
  easy_localization: ^3.0.8
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  cached_network_image: ^3.4.1
  top_snackbar_flutter: ^3.3.0
  lottie: ^3.5.1
  multi_select_flutter: ^4.1.3
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  drift_dev: ^2.25.0
  flutter_flavorizr: ^2.2.3

flavorizr:
  app:
    name: "Attendly"

  flavors:
    local:
      app:
        name: "Attendly Local"
      android:
        applicationId: "com.neythuaung.attendly.local"
      ios:
        bundleId: "com.neythuaung.attendly.local"

    staging:
      app:
        name: "Attendly Staging"
      android:
        applicationId: "com.neythuaung.attendly.staging"
      ios:
        bundleId: "com.neythuaung.attendly.staging"

    prod:
      app:
        name: "Attendly"
      android:
        applicationId: "com.neythuaung.attendly"
      ios:
        bundleId: "com.neythuaung.attendly"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/brand/
    - assets/icons/
    - assets/images/
    - assets/loading/
    - assets/animations/
    - assets/translations/
